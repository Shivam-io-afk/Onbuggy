services:
  - type: web
    name: onbuggy-server
    env: node
    plan: free
    region: singapore # or oregon / frankfurt
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # Set in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: CLIENT_URL
        sync: false # e.g. https://onbuggy.vercel.app
      - key: KEEP_ALIVE_INTERVAL_MINS
        value: "10"

