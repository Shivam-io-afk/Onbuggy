name: Render Server Anti-Sleep Keep-Alive

on:
  schedule:
    # Trigger every 14 minutes (Render sleeps after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Check
        run: |
          RENDER_URL="${{ secrets.RENDER_SERVER_URL }}"
          if [ -z "$RENDER_URL" ]; then
            # Default fallback if secret not set
            RENDER_URL="https://onbuggy-server.onrender.com"
          fi
          echo "Pinging ${RENDER_URL}/api/health..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${RENDER_URL}/api/health")
          echo "Render response status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Render backend is active and awake!"
          else
            echo "⚠️ Health check returned code $STATUS (Server may be spinning up)"
          fi

